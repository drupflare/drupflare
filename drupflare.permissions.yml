view drupflare status:
  title: 'View the Drupflare runtime status'
  description: 'Read the daily meters, the replica pool, the page tiers and the outbound queues. Read only; nothing on that page is configuration.'

administer drupflare site:
  title: 'Administer the Drupflare site'
  description: 'Change the runtime levers, size the replica pool, and use the operations terminal to rebuild caches, drain queues and run database updates. Nothing here runs code the site did not ship with.'

administer drupflare owner:
  title: 'Own the Drupflare site'
  description: 'Deliver code: wire a git remote, install a package or a module, or upload a module tree. Only an account that already holds this permission can grant it.'
  restrict access: true
