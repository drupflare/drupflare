drupflare.ops_terminal:
  path: '/admin/config/development/drupflare-ops'
  defaults:
    _form: 'Drupal\drupflare\Form\OpsTerminalForm'
    _title: 'Operations Terminal'
  requirements:
    _permission: 'administer drupflare site'
  options:
    _admin_route: true

drupflare.oidc_complete:
  path: '/drupflare/oidc/complete'
  defaults:
    _controller: 'Drupal\drupflare\Network\CfwOidc::complete'
    _title: 'Completing sign-in'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true

drupflare.admin:
  path: '/admin/config/drupflare'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Drupflare'
  requirements:
    _permission: 'view drupflare status+administer site configuration'
  options:
    _admin_route: true

drupflare.status:
  path: '/admin/config/drupflare/status'
  defaults:
    _controller: '\Drupal\drupflare\Controller\StatusController::page'
    _title: 'Runtime Status'
  requirements:
    _permission: 'view drupflare status+administer site configuration'
  options:
    _admin_route: true

drupflare.settings:
  path: '/admin/config/drupflare/settings'
  defaults:
    _form: 'Drupal\drupflare\Form\SettingsForm'
    _title: 'Runtime Settings'
  requirements:
    _permission: 'administer drupflare site'
  options:
    _admin_route: true

drupflare.modules:
  path: '/admin/modules/drupflare'
  defaults:
    _controller: '\Drupal\drupflare\Controller\ModulesController::page'
    _title: 'Code Delivery'
  requirements:
    _permission: 'administer drupflare owner'
  options:
    _admin_route: true
