services:
  logger.cfw:
    class: Drupal\drupflare\Logger\CfwLogger
    arguments: ['@logger.log_message_parser']
    tags:
      - { name: logger }

  drupflare.http_deferred:
    class: Drupal\drupflare\Queue\CfwDeferredHttp

  drupflare.request_resetter:
    class: Drupal\drupflare\RequestResetter
    arguments: ['@service_container']

  drupflare.solarium_transport:
    class: Drupal\drupflare\Search\SolariumTransport
    tags:
      - { name: event_subscriber }
